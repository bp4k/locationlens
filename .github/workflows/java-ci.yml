name: Java CI
# Compiles Java code and ensures that the authentication tests ( AuthController/IdpTokenRelaySuccessHandler ) are working 
# Does not consider LocationIensApplicationTest because it will fail w/o IDP_URL configured
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions: 
  # checkout needs read access to fetch repo, and declaring it keeps the workflow working if those defaults are later tightened while ensuring it oes not get write access. 
  contents: read
jobs:
  auth-tests:
    name: Compile and Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2 

      - name: Set up Java 21
        uses: actions/setup-java@v4.5.0 
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Backend Tests
        env:
          DB_URL: jdbc:h2:mem:locationlens-tests;DB_CLOSE_DELAY=-1
          DB_USER: sa
          DB_PASS: ""
          FLYWAY_ENABLED: "false"
          DDL_AUTO: create-drop
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            '-Dtest=*Test,*Tests,!LocationlensApplicationTests' \
            test