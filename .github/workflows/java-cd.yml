#CD workflow 
name: Java-CD 


on: 
  push: 
    branches: ["master"]

jobs: 
  deploy: 
    runs-on: ubuntu-latest
    steps:
     - name: Check out repository
       uses: actions/checkout@v4.2.2 

     - name: Set up Java 21
       uses: actions/setup-java@v4.5.0 
       with: 
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
    #  Build fat executable JAR file
     - name: Build with Maven 
       run: ./mvmw clean package -Dskiptests
     - name: Authenticate to Google Cloud 
       uses: google-github-action/auth@v4
