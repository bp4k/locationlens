name: Deploy Backend to App Engine

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Java 21
        uses: actions/setup-java@v4.5.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test and Package Backend
        env:
          DB_URL: jdbc:h2:mem:locationlens-tests;DB_CLOSE_DELAY=-1
          DB_USER: sa
          DB_PASS: ""
          FLYWAY_ENABLED: "false"
          DDL_AUTO: create-drop
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            '-Dtest=*Test,*Tests,!LocationlensApplicationTests' \
            verify

      - name: Prepare Runtime Configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
          CI_DB_NAME: ${{ vars.CI_DB_NAME }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          CI_DB_USERNAME: ${{ secrets.CI_DB_USERNAME }}
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          IDP_URI: ${{ secrets.IDP_URI || vars.IDP_URI }}
          IDP_CLIENT_ID: ${{ secrets.IDP_CLIENT_ID || vars.IDP_CLIENT_ID }}
          IDP_CLIENT_SECRET: ${{ secrets.IDP_CLIENT_SECRET }}
          VALID_REDIRECTS: ${{ secrets.VALID_REDIRECTS || vars.VALID_REDIRECTS }}
        run: ruby .github/scripts/prepare-appengine.rb

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy Backend
        id: deploy
        uses: google-github-actions/deploy-appengine@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          deliverables: target/appengine/app.yaml
          version: backend-${{ github.run_id }}-${{ github.run_attempt }}
          promote: false

      - name: Report Deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          printf 'Backend deployment URL: %s\nTraffic was not promoted.\n' "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove Generated Runtime Configuration
        if: always()
        run: rm -rf target/appengine