runtime: java21
env: standard
service: default
instance_class: F2

entrypoint: java -XX:MaxRAMPercentage=60.0 -Dserver.port=$PORT -Dserver.forward-headers-strategy=native -jar app.jar

automatic_scaling:
  max_instances: 2

env_variables:
  FLYWAY_ENABLED: "true"
  DDL_AUTO: "validate"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: "INFO"